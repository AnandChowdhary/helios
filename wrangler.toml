name = "helios"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "0f5ad4e52108866c892fca418834b9b8"

# Environment variables (secrets added via wrangler secret)
[vars]
ENVIRONMENT = "production"

# KV Namespaces
[[kv_namespaces]]
binding = "TASKS"
id = "38dcdb28b5214465925f096f05b554e1"

[[kv_namespaces]]
binding = "API_KEYS"
id = "57605e42b86f4f97936152071207d8a5"

[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "0d19024897cd48d6bba3c88ddd01afae"

# R2 Buckets for storing logs and artifacts
[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "helios-artifacts"

# Queues (Workers Paid plan enabled)
[[queues.producers]]
binding = "TASK_QUEUE"
queue = "helios-tasks"

[[queues.consumers]]
queue = "helios-tasks"
max_batch_size = 1
max_batch_timeout = 30

# Container for Claude Code runner
[[containers]]
class_name = "ClaudeRunner"
image = "./container/Dockerfile"
max_instances = 10

# Durable Object binding for the container
[[durable_objects.bindings]]
name = "CLAUDE_RUNNER"
class_name = "ClaudeRunner"

# Migrations for Durable Objects (required for container-enabled DOs)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ClaudeRunner"]

# Staging environment
[env.staging]
name = "helios-staging"
vars = { ENVIRONMENT = "staging" }

# Staging KV - using same namespaces as production for now
# To create separate staging namespaces, run:
#   wrangler kv:namespace create TASKS --env staging
#   wrangler kv:namespace create API_KEYS --env staging
#   wrangler kv:namespace create RATE_LIMITS --env staging
[[env.staging.kv_namespaces]]
binding = "TASKS"
id = "38dcdb28b5214465925f096f05b554e1"

[[env.staging.kv_namespaces]]
binding = "API_KEYS"
id = "57605e42b86f4f97936152071207d8a5"

[[env.staging.kv_namespaces]]
binding = "RATE_LIMITS"
id = "0d19024897cd48d6bba3c88ddd01afae"

# Staging R2 Bucket
[[env.staging.r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "helios-artifacts-staging"

# Staging Queue
[[env.staging.queues.producers]]
binding = "TASK_QUEUE"
queue = "helios-tasks-staging"

[[env.staging.queues.consumers]]
queue = "helios-tasks-staging"
max_batch_size = 1
max_batch_timeout = 30

# Staging Container - same config, Cloudflare handles isolation
[[env.staging.containers]]
class_name = "ClaudeRunner"
image = "./container/Dockerfile"
max_instances = 5

# Staging Durable Object binding
[[env.staging.durable_objects.bindings]]
name = "CLAUDE_RUNNER"
class_name = "ClaudeRunner"
